<!DOCTYPE html>
<html>
<head>
  <title>GS Finance Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <style>
    body { background:#111; color:#fff; font-family:sans-serif; text-align:center;}
    input,button { padding:10px; margin:5px; }
    .box { background:#222; margin:10px; padding:15px; border-radius:10px;}
  </style>
</head>

<body>

<h2>💰 GS Finance Pro (Cloud)</h2>

<!-- LOGIN -->
<div id="loginBox" class="box">
  <input id="email" placeholder="Email"><br>
  <input id="pass" type="password" placeholder="Password"><br>

  <button onclick="login()">Login</button>
  <button onclick="signup()">Signup</button>
  <br>
  <button onclick="biometric()">🔐 Fingerprint</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <div class="box">
    <h3>Add Party</h3>
    <input id="name" placeholder="Name">
    <input id="amount" placeholder="Amount">
    <button onclick="addParty()">Add</button>
  </div>

  <div class="box">
    <h3>EMI Calculator</h3>
    <input id="p" placeholder="Loan">
    <input id="r" placeholder="Rate %">
    <input id="n" placeholder="Months">
    <button onclick="emi()">Calculate</button>
    <div id="emiResult"></div>
  </div>

  <div class="box">
    <h3>Parties</h3>
    <div id="list"></div>
  </div>

</div>

<script>

// Firebase config
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let role = "staff";

// AUTH
function signup(){
  let email = emailVal();
  let pass = passVal();

  auth.createUserWithEmailAndPassword(email, pass)
  .then(res=>{
    db.collection("users").doc(res.user.uid).set({
      role:"staff"
    });
    alert("Signup done");
  });
}

function login(){
  auth.signInWithEmailAndPassword(emailVal(), passVal())
  .then(res=>{
    loadRole(res.user.uid);
  });
}

function loadRole(uid){
  db.collection("users").doc(uid).get().then(doc=>{
    role = doc.data().role;
    startApp();
  });
}

// BIOMETRIC (WebAuthn)
async function biometric(){
  try{
    await navigator.credentials.get({
      publicKey:{
        challenge:new Uint8Array(32)
      }
    });
    startApp();
  }catch{
    alert("Not supported");
  }
}

// START
function startApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("app").style.display="block";
  loadData();
}

// ADD PARTY
function addParty(){
  let data={
    name: val("name"),
    balance: parseInt(val("amount")),
    user: auth.currentUser.uid
  };

  db.collection("parties").add(data);

  // SMS Reminder Button
  window.open(`sms:?body=Installment for ${data.name}`);

}

// LOAD
function loadData(){
  db.collection("parties")
  .where("user","==",auth.currentUser.uid)
  .onSnapshot(snap=>{
    let html="";
    snap.forEach(doc=>{
      let p = doc.data();

      html += `
      <div class="box">
        ${p.name} - ₹${p.balance}
        <br>
        ${role==="admin" ? `<button onclick="del('${doc.id}',${p.balance})">Delete</button>` : ""}
      </div>`;
    });

    document.getElementById("list").innerHTML = html;
  });
}

// DELETE
function del(id,bal){
  if(bal===0){
    db.collection("parties").doc(id).delete();
  } else {
    alert("Balance not zero");
  }
}

// EMI
function emi(){
  let p = +val("p");
  let r = +val("r")/12/100;
  let n = +val("n");

  let e = (p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);

  document.getElementById("emiResult").innerText = "EMI: ₹"+e.toFixed(2);
}

// HELPERS
function val(id){ return document.getElementById(id).value; }
function emailVal(){ return val("email"); }
function passVal(){ return val("pass"); }

</script>

</body>
</html>
